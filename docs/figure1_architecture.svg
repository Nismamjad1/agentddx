<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="740" viewBox="0 0 1060 740" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="AgentDDx architecture">
<title>AgentDDx architecture</title>
<desc>A five-stage agentic differential-diagnosis pipeline. Stage 1 extracts clinical entities with the shared backbone. Stage 2 builds one structured MeSH query per candidate answer option, with a free-text fallback merged by PMID. Stage 3 retrieves from PubMed through NCBI Entrez, the only external tool. Stage 4 scores each abstract for relevance and discards those below 0.4. Stage 5 answers with the same backbone and the answer is unshuffled and scored. A dashed entity-summary path bypasses stages 2 to 4, and a dashed interactive branch lies outside the closed-form evaluation.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g stroke-width="1">
<rect x="16" y="16" width="230" height="180" rx="10" fill="#F7F6F2" stroke="#B4B2A9"/>
<rect x="266" y="16" width="380" height="180" rx="10" fill="#F7F6F2" stroke="#B4B2A9"/>
<rect x="666" y="16" width="318" height="180" rx="10" fill="#F7F6F2" stroke="#B4B2A9"/>
<rect x="16" y="216" width="310" height="300" rx="10" fill="#F7F6F2" stroke="#B4B2A9"/>
<rect x="346" y="216" width="300" height="300" rx="10" fill="#F7F6F2" stroke="#B4B2A9"/>
<rect x="666" y="216" width="318" height="300" rx="10" fill="#F7F6F2" stroke="#B4B2A9"/>
<rect x="16" y="536" width="630" height="180" rx="10" fill="none" stroke="#B4B2A9"/>
<rect x="666" y="536" width="318" height="180" rx="10" fill="none" stroke="#888780" stroke-dasharray="6 5"/>
</g>

<g font-size="19" font-weight="700" fill="#2C2C2A">
<text x="32" y="44">Input</text>
<text x="282" y="44">Stage 1: Entity extraction</text>
<text x="682" y="44">Stage 5: Answering</text>
<text x="32" y="244">Stage 2: Query building</text>
<text x="362" y="244">Stage 3: Retrieval</text>
<text x="682" y="244">Stage 4: Relevance filter</text>
</g>

<rect x="32" y="58" width="198" height="48" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="131" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Clinical vignette</text>
<line x1="131" y1="108" x2="131" y2="120" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="32" y="122" width="198" height="58" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="131" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Answer options A–D</text>
<text x="131" y="169" text-anchor="middle" font-size="15" fill="#5F5E5A">shuffled per question</text>

<rect x="282" y="76" width="150" height="64" rx="7" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="357" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">Backbone call</text>
<text x="357" y="123" text-anchor="middle" font-size="15" fill="#534AB7">shared model</text>
<line x1="434" y1="108" x2="444" y2="108" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="448" y="58" width="182" height="100" rx="7" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="539" y="82" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Typed JSON record</text>
<text x="539" y="104" text-anchor="middle" font-size="15" fill="#5F5E5A">symptoms, findings</text>
<text x="539" y="124" text-anchor="middle" font-size="15" fill="#5F5E5A">labs with units</text>
<text x="539" y="144" text-anchor="middle" font-size="15" fill="#5F5E5A">meds, demographics</text>
<text x="282" y="180" font-size="15" fill="#5F5E5A">Entities seed queries and the answer prompt.</text>

<rect x="682" y="58" width="146" height="64" rx="7" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="755" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">Backbone call</text>
<text x="755" y="105" text-anchor="middle" font-size="15" fill="#534AB7">shared model</text>
<line x1="830" y1="90" x2="838" y2="90" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="842" y="58" width="126" height="64" rx="7" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="905" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Final answer</text>
<text x="905" y="105" text-anchor="middle" font-size="15" fill="#5F5E5A">letter tag</text>
<line x1="905" y1="124" x2="905" y2="132" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="682" y="136" width="286" height="52" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="825" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Unshuffle and score</text>
<text x="825" y="180" text-anchor="middle" font-size="15" fill="#5F5E5A">via stored permutation</text>

<text x="32" y="266" font-size="15" fill="#5F5E5A">four branches, one per answer option</text>
<g fill="#FDFDFC" stroke="#888780" stroke-width="1">
<rect x="44" y="274" width="262" height="150" rx="8"/>
<rect x="38" y="280" width="262" height="150" rx="8"/>
<rect x="32" y="286" width="262" height="150" rx="8"/>
</g>
<text x="278" y="304" text-anchor="end" font-size="15" font-weight="700" fill="#5F5E5A">×4</text>
<rect x="48" y="312" width="230" height="44" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="163" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Candidate option</text>
<line x1="163" y1="358" x2="163" y2="368" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="48" y="370" width="230" height="52" rx="7" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="163" y="394" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">Structured query</text>
<text x="163" y="414" text-anchor="middle" font-size="15" fill="#534AB7">MeSH + Boolean terms</text>
<path d="M100 438 L100 452" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="112" y="450" font-size="15" fill="#5F5E5A">if &lt; 2 articles</text>
<rect x="32" y="456" width="262" height="48" rx="7" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="163" y="478" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">Free-text fallback</text>
<text x="163" y="497" text-anchor="middle" font-size="15" fill="#534AB7">results merged by PMID</text>

<rect x="362" y="262" width="268" height="64" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="496" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#085041">PubMed / NCBI Entrez</text>
<text x="496" y="309" text-anchor="middle" font-size="15" fill="#0F6E56">sorted by relevance, ≤4/query</text>
<line x1="496" y1="328" x2="496" y2="342" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="362" y="344" width="268" height="76" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="496" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Section-aware truncation</text>
<text x="496" y="391" text-anchor="middle" font-size="15" fill="#5F5E5A">keeps Results and Conclusions</text>
<text x="496" y="411" text-anchor="middle" font-size="15" fill="#5F5E5A">over leading characters</text>
<line x1="496" y1="422" x2="496" y2="436" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="362" y="438" width="268" height="56" rx="7" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="496" y="464" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Retained abstracts</text>
<text x="496" y="485" text-anchor="middle" font-size="15" fill="#5F5E5A">≤300 characters each</text>

<g fill="#EEEDFE" stroke="#7F77DD" stroke-width="1">
<rect x="694" y="260" width="250" height="56" rx="7"/>
<rect x="688" y="266" width="250" height="56" rx="7"/>
<rect x="682" y="272" width="250" height="56" rx="7"/>
</g>
<text x="920" y="290" text-anchor="end" font-size="15" font-weight="700" fill="#5F5E5A">×N</text>
<text x="807" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">Relevance scorer</text>
<text x="807" y="317" text-anchor="middle" font-size="15" fill="#534AB7">0–1, one call per abstract</text>
<line x1="807" y1="330" x2="807" y2="344" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="682" y="346" width="286" height="76" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="825" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Discard if score &lt; 0.4</text>
<text x="825" y="393" text-anchor="middle" font-size="15" fill="#5F5E5A">top-ranked abstract kept if</text>
<text x="825" y="413" text-anchor="middle" font-size="15" fill="#5F5E5A">none clears the threshold</text>
<line x1="825" y1="424" x2="825" y2="438" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="682" y="440" width="286" height="56" rx="7" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="825" y="466" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Filtered evidence</text>
<text x="825" y="487" text-anchor="middle" font-size="15" fill="#5F5E5A">≤2 per candidate, ≤8 per question</text>

<line x1="248" y1="108" x2="262" y2="108" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="300" y1="198" x2="300" y2="212" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="328" y1="366" x2="342" y2="366" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="648" y1="366" x2="662" y2="366" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="750" y1="214" x2="750" y2="200" stroke="#444441" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="648" y1="150" x2="662" y2="150" stroke="#7F77DD" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahp)"/>
<path d="M986 150 L1022 150 L1022 522 L825 522 L825 532" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahg)"/>

<text x="32" y="564" font-size="17" font-weight="700" fill="#2C2C2A">Ablated configurations</text>
<g font-size="15" fill="#5F5E5A">
<text x="32" y="590">LLM-only — entity and evidence paths cut</text>
<text x="32" y="612">entities-only — evidence path cut</text>
<text x="32" y="634">evidence-only — entity summary path cut</text>
<text x="32" y="656">full, filter off — stage 4 bypassed</text>
<text x="32" y="678">full system — all paths active</text>
</g>
<text x="350" y="564" font-size="17" font-weight="700" fill="#2C2C2A">Key</text>
<rect x="350" y="578" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="376" y="591" font-size="15" fill="#444441">LLM call, one shared backbone</text>
<rect x="350" y="604" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="376" y="617" font-size="15" fill="#444441">External tool (PubMed API)</text>
<rect x="350" y="630" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="376" y="643" font-size="15" fill="#444441">Deterministic step</text>
<line x1="350" y1="662" x2="370" y2="662" stroke="#7F77DD" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="378" y="667" font-size="15" fill="#444441">Entity summary path</text>
<line x1="350" y1="684" x2="370" y2="684" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="378" y="689" font-size="15" fill="#444441">Outside the closed-form evaluation</text>

<text x="682" y="564" font-size="17" font-weight="700" fill="#2C2C2A">Interactive branch</text>
<text x="682" y="586" font-size="15" fill="#5F5E5A">outside the closed-form evaluation</text>
<rect x="682" y="600" width="286" height="52" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="6 5"/>
<text x="825" y="624" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Open-ended differential</text>
<text x="825" y="644" text-anchor="middle" font-size="15" fill="#5F5E5A">supporting and opposing</text>
<line x1="825" y1="654" x2="825" y2="662" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ahg)"/>
<rect x="682" y="664" width="286" height="48" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="6 5"/>
<text x="825" y="686" text-anchor="middle" font-size="17" font-weight="700" fill="#444441">Follow-up question</text>
<text x="825" y="705" text-anchor="middle" font-size="15" fill="#5F5E5A">when case is ambiguous</text>
</svg>
